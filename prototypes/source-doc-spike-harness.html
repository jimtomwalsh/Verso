<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SPIKE HARNESS — source-doc.js model drives a real contentEditable</title>
<!--
  THROWAWAY spike harness for the node-model-undo frontier ticket. Loads the REAL
  src/source-doc.js (the shipped model+undo core) and projects it to a live contentEditable
  with CSS Custom Highlight API painting, then exposes window.__spike so the Puppeteer probe
  can drive a real DOM delete + owned undo and confirm the mark re-anchors. Not wired to the
  app; proves the production mechanism the pure tests can't (a real contentEditable + Highlight).
  Content = INVENTED (Orchard-9) — no customer material.
-->
<style>
  body{font:15px/1.6 -apple-system,system-ui,sans-serif;margin:40px;color:#1d2126}
  #doc{max-width:640px;border:1px solid #e6e8ec;border-radius:8px;padding:24px 28px;outline:none}
  #doc[contenteditable="true"]{box-shadow:0 0 0 2px #eaf0ff}
  ::highlight(sd-link){background:#c7d8ff52;text-decoration:underline #3b6cf6 2px}
  ::highlight(sd-alt){background:#fde68a4d}
  ::highlight(sd-broken){background:#ef44442e;text-decoration:line-through #dc2626}
  h2{font-size:20px;margin:0 0 .4em}
</style>
</head>
<body>
<article id="doc" contenteditable="true" spellcheck="false"></article>
<script src="../src/source-doc.js"></script>
<script>
(function(){
  "use strict";
  var SD = window.SourceDoc;
  var HAS_HL = typeof CSS !== "undefined" && CSS.highlights && typeof Highlight !== "undefined";
  var docEl = document.getElementById("doc");
  var HL = {};
  if (HAS_HL) ["link","alt","broken"].forEach(function(k){ HL[k] = new Highlight(); CSS.highlights.set("sd-"+k, HL[k]); });

  // one seeded topic: heading + two paragraphs, a link mark on a phrase in p2
  var model = SD.create([
    { type: "heading", level: 2, text: "Zone configuration" },
    { type: "paragraph", text: "Each zone carries an independent schedule and a moisture set-point." },
    { type: "paragraph", text: "The controller arbitrates contention by line-pressure headroom, deferring lower-priority zones." }
  ]);
  var pKey = model.nodes[2].key;
  var phrase = "arbitrates contention by line-pressure headroom";
  var start = SD.nodeText(model.nodes[2]).indexOf(phrase);
  var mark = SD.addMark(model, { type: "link", anchor: { nodeKey: pKey, start: start, len: phrase.length }, locations: [{ doc: "Quick-Start", section: "Wiring", loc: "Step 4" }] });

  // --- projection: model -> DOM (each node an element keyed by node.key) ---
  function render(){
    docEl.innerHTML = "";
    model.nodes.forEach(function(n){
      var el = n.type === "heading" ? document.createElement("h2") : document.createElement("p");
      el.setAttribute("data-node", n.key);
      el.textContent = SD.nodeText(n);
      docEl.appendChild(el);
    });
    paint();
  }
  function nodeEl(key){ return docEl.querySelector('[data-node="'+key+'"]'); }
  // compute a live Range from a model anchor (nodes render as a single text node)
  function rangeFor(anchor){
    var el = nodeEl(anchor.nodeKey); if (!el || !el.firstChild) return null;
    var tn = el.firstChild, r = document.createRange();
    try { r.setStart(tn, Math.min(anchor.start, tn.length)); r.setEnd(tn, Math.min(anchor.start + anchor.len, tn.length)); return r; }
    catch(e){ return null; }
  }
  function paint(){
    if (!HAS_HL) return;
    Object.keys(HL).forEach(function(k){ HL[k].clear(); });
    (model.marks || []).forEach(function(m){
      SD.refreshMark(model, m);
      if (m.broken) { var rb = rangeFor(m.anchor); if (rb) try { HL.broken.add(rb); } catch(e){} return; }
      var r = rangeFor(m.anchor); if (!r) return;
      try { HL[m.type === "link" ? "link" : "alt"].add(r); } catch(e){}
    });
  }

  // read a node's live text back into the model (what the editor does on input)
  function syncNode(key){ var el = nodeEl(key); if (el) SD.applyTextEdit(model, key, el.textContent); }

  render();

  // expose a tiny API for the Puppeteer probe to drive real DOM edits + owned undo
  window.__spike = {
    hasHighlight: function(){ return HAS_HL; },
    markState: function(){ var m = SD.markById(model, mark.id); return { broken: m.broken, anchored: SD.anchorText(model, m.anchor), linkKept: !!(m.locations && m.locations[0]) }; },
    highlightCounts: function(){ return { link: HL.link ? HL.link.size : -1, broken: HL.broken ? HL.broken.size : -1 }; },
    // simulate a real contentEditable deletion of the marked phrase, then sync + repaint
    deletePhrase: function(){
      var el = nodeEl(pKey);
      el.textContent = el.textContent.replace(phrase, "does that");
      syncNode(pKey);
      paint();
      return this.markState();
    },
    // owned undo: restore model snapshot, re-render, repaint (re-anchors the mark)
    undo: function(){ SD.undo(model); render(); return this.markState(); },
    redo: function(){ SD.redo(model); render(); return this.markState(); }
  };
})();
</script>
</body>
</html>
