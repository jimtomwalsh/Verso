<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SPIKE HARNESS — source-marks.js range-mark engine</title>
<!--
  THROWAWAY harness for the range-mark-engine ticket. Loads the REAL src/source-doc.js +
  src/source-marks.js and paints three distinct mark types over a projected node model with the
  CSS Custom Highlight API. Exposes window.__h so the Puppeteer probe can drive selection ->
  anchor, ⟳ update, and broken repaint against the real engine. Content = INVENTED (Orchard-9).
-->
<style>
  body{font:15px/1.6 system-ui,sans-serif;margin:40px;color:#1d2126}
  #doc{max-width:640px;border:1px solid #e6e8ec;border-radius:8px;padding:24px 28px;outline:none}
  ::highlight(sd-link){background:#c7d8ff52;text-decoration:underline #3b6cf6 2px}
  ::highlight(sd-alt){background:#fde68a4d}
  ::highlight(sd-comment){background:#99f6e438;text-decoration:underline dotted #14b8a6 2px}
  ::highlight(sd-active){background:#eab30855}
  ::highlight(sd-stale){background:#f9731628}
  ::highlight(sd-broken){background:#ef44442e;text-decoration:line-through #dc2626}
  h2{font-size:20px;margin:0 0 .4em}
</style>
</head>
<body>
<article id="doc" contenteditable="true" spellcheck="false"></article>
<script src="../src/source-doc.js"></script>
<script src="../src/source-marks.js"></script>
<script>
(function(){
  "use strict";
  window.__ran = 1;
  try {
  var SD = window.SourceDoc, SM = window.SourceMarks;
  var docEl = document.getElementById("doc");
  var model = SD.create([
    { type: "heading", level: 2, text: "Telemetry and faults" },
    { type: "paragraph", text: "The controller retains a rolling seventy-two-hour telemetry buffer and flags any degraded zone." },
    { type: "paragraph", text: "It arbitrates contention by line-pressure headroom, deferring lower-priority zones until pressure is available." }
  ]);
  var kBuf = model.nodes[1].key, kArb = model.nodes[2].key;
  var tBuf = SD.nodeText(model.nodes[1]), tArb = SD.nodeText(model.nodes[2]);
  var alt = SD.addMark(model, { type: "alternate", anchor: { nodeKey: kBuf, start: tBuf.indexOf("rolling seventy-two-hour telemetry buffer"), len: "rolling seventy-two-hour telemetry buffer".length }, alt: "keeps 72h of data" });
  var link = SD.addMark(model, { type: "link", anchor: { nodeKey: kArb, start: tArb.indexOf("arbitrates contention by line-pressure headroom"), len: "arbitrates contention by line-pressure headroom".length }, locations: [{ doc: "Field-Tech eLearning", section: "Zone logic", loc: "Screen 7" }] });
  var cmt = SD.addMark(model, { type: "comment", anchor: { nodeKey: kBuf, start: tBuf.indexOf("degraded zone"), len: "degraded zone".length }, comments: [{ who: "Sam", ts: "09:14", text: "Define degraded?" }] });

  var eng = SM.create({ root: docEl, model: model });

  function render(){
    docEl.innerHTML = "";
    model.nodes.forEach(function(n){
      var el = n.type === "heading" ? document.createElement("h2") : document.createElement("p");
      el.setAttribute("data-node", n.key);
      el.textContent = SD.nodeText(n);
      docEl.appendChild(el);
    });
    eng.paint();
  }
  function nodeEl(k){ return docEl.querySelector('[data-node="'+k+'"]'); }
  function selectPhrase(key, phrase){
    var el = nodeEl(key), tn = el.firstChild, i = tn.textContent.indexOf(phrase);
    var r = document.createRange(); r.setStart(tn, i); r.setEnd(tn, i + phrase.length);
    var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
  }
  function counts(){ var reg = SM._registry(); return { link: reg.link.size, alt: reg.alt.size, comment: reg.comment.size, broken: reg.broken.size, active: reg.active.size, stale: reg.stale.size }; }

  render();

  window.__h = {
    hasHighlight: function(){ return eng.hasHighlight(); },
    paintedCounts: function(){ return counts(); },
    statuses: function(){ return model.marks.map(function(m){ return { type: m.type, dot: SD.markStatus(m).dot }; }); },
    // read a live selection into a model anchor
    selectionAnchor: function(phrase, key){ selectPhrase(key || kArb, phrase); return eng.selectionAnchor(); },
    // ⟳ update: select a span that extends past the link, confirm markExtendedBy then updateMark
    testUpdate: function(){
      var extended = "arbitrates contention by line-pressure headroom, deferring lower-priority zones";
      selectPhrase(kArb, extended);
      var anchor = eng.selectionAnchor();
      var target = SD.markExtendedBy(model, anchor);
      var isLink = target && target.id === link.id;
      if (isLink) SD.updateMark(model, link.id, anchor);
      eng.paint();
      var m = SD.markById(model, link.id);
      return { offeredUpdate: !!isLink, newLen: m.anchor.len, coversExtended: SD.anchorText(model, m.anchor) === extended };
    },
    // delete the alternate's span in the live DOM, sync, repaint -> broken
    breakAlt: function(){
      var el = nodeEl(kBuf);
      el.textContent = el.textContent.replace("rolling seventy-two-hour telemetry buffer", "buffer");
      SD.applyTextEdit(model, kBuf, el.textContent);
      eng.paint();
      var m = SD.markById(model, alt.id);
      return { broken: m.broken, dot: SD.markStatus(m).dot, historyLogged: (model.history || []).some(function(h){ return h.type === "mark-broken"; }), counts: counts() };
    },
    markAtClick: function(phrase, key){
      var el = nodeEl(key || kArb), tn = el.firstChild, i = tn.textContent.indexOf(phrase);
      var m = eng.markAtPoint(tn, i + 2);
      return m ? m.type : null;
    }
  };
  } catch (e) { window.__herr = String(e && e.stack || e); }
})();
</script>
</body>
</html>
