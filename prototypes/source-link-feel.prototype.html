<!doctype html>
<!--
  THROWAWAY PROTOTYPE — Source -> Edit live-linking feel.  v2: custom pointer-drag.
  Not production. In-memory mock of two stages + the link model. Neutral content only.
  Question: how does cross-stage live-linking FEEL end to end (panel-as-source-doc,
  select+drag, inline-span vs new block, per-span link icons, live base-edit warning +
  fork, create/pick alternate, two-way jump)?  Open from file:// or the local server.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verso — Source↔Edit linking (prototype)</title>
<style>
  :root{
    --bg:#f4f5f7; --panel:#ffffff; --ink:#1f2430; --muted:#6b7280; --line:#e4e7ec;
    --accent:#3b5bdb; --accent-soft:#e7ecff;
    --link:#7048e8; --link-soft:#f0eaff; --link-line:#c8b6f7;
    --alt:#0ca678; --alt-soft:#e3faf3; --alt-line:#8ce0c8;
    --warn:#e8590c;
    --radius:8px; --shadow:0 6px 24px rgba(20,25,40,.14);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
  body.dragging-src{cursor:grabbing;user-select:none}
  body.arming .canvas{outline:2px dashed var(--link);outline-offset:8px}
  body.arming{cursor:crosshair}
  button{font-family:inherit;font-size:inherit;cursor:pointer}
  .icon{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px;flex:none}

  .app{display:flex;flex-direction:column;height:100vh}
  .topbar{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
  .brand{font-weight:700}.brand small{color:var(--muted);font-weight:500}
  .stage-switch{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:3px}
  .stage-switch button{border:0;background:transparent;color:var(--muted);padding:5px 14px;border-radius:16px;font-weight:600}
  .stage-switch button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .spacer{flex:1}.hint{color:var(--muted);font-size:12px;max-width:520px;text-align:right}

  .stage{flex:1;min-height:0;display:none}.stage.on{display:flex}

  /* EDIT */
  .lpanel{width:350px;min-width:280px;max-width:46%;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
  .lpanel__tabs{display:flex;gap:2px;padding:8px 8px 0;border-bottom:1px solid var(--line)}
  .lpanel__tab{border:0;background:transparent;color:var(--muted);padding:7px 12px;font-weight:600;border-radius:6px 6px 0 0}
  .lpanel__tab.on{color:var(--ink);background:var(--bg)}
  .srcsearch{padding:8px;border-bottom:1px solid var(--line);display:flex;gap:6px;align-items:center}
  .srcsearch input{flex:1;border:1px solid var(--line);border-radius:6px;padding:6px 9px;font:inherit}
  .srcsearch .nav{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:12px}
  .srcsearch .nav button{border:1px solid var(--line);background:var(--panel);border-radius:5px;width:24px;height:24px;display:grid;place-items:center;color:var(--ink)}
  .toc{border-bottom:1px solid var(--line);max-height:140px;overflow:auto;padding:6px 4px}
  .toc__row{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);padding:4px 10px;border-radius:6px;font-size:13px}
  .toc__row:hover{background:var(--bg)}.toc__row.chap{font-weight:700}.toc__row.sub{padding-left:24px;color:var(--muted)}
  .srcdoc{flex:1;overflow:auto;padding:12px 14px 40px}
  .srcdoc h2{font-size:16px;margin:18px 0 6px}
  .srcdoc h3{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:14px 0 4px}
  .srcdoc p{margin:0 0 10px}
  .srcdoc figure{margin:0 0 12px;position:relative}
  .srcdoc img{max-width:100%;border-radius:6px;display:block;border:1px solid var(--line)}
  .srcdoc figcaption{color:var(--muted);font-size:12px;margin-top:3px}
  .fig-grab{position:absolute;top:8px;left:8px;display:none;align-items:center;gap:4px;background:var(--link);color:#fff;border:0;border-radius:6px;padding:4px 8px;font-size:12px;font-weight:600;cursor:grab;box-shadow:var(--shadow)}
  .fig-grab .icon{stroke:#fff;width:13px;height:13px}
  .srcdoc figure:hover .fig-grab{display:inline-flex}
  .srcdoc .findhit{background:#fff3bf;border-radius:2px}
  .srcdoc .linked{background:var(--link-soft);border-bottom:2px solid var(--link-line);border-radius:2px;cursor:pointer}
  .srcdoc.dimlinks .linked{background:transparent;border-bottom:0}

  /* selection bar */
  .selbar{position:fixed;z-index:75;display:none;gap:6px;background:#111827;padding:5px;border-radius:9px;box-shadow:var(--shadow)}
  .selbar button{border:0;border-radius:6px;padding:6px 11px;font-weight:600;font-size:12px;color:#fff}
  .selbar__grab{background:var(--link);cursor:grab;display:inline-flex;align-items:center;gap:6px;touch-action:none}
  .selbar__grab .icon{stroke:#fff}
  .selbar__place{background:#374151}
  .grabchip{position:fixed;z-index:90;pointer-events:none;background:var(--link);color:#fff;padding:5px 10px;border-radius:7px;font-size:12px;box-shadow:var(--shadow);opacity:.97}
  .grabchip .icon{stroke:#fff}

  .canvaswrap{flex:1;min-width:0;overflow:auto;padding:26px;display:flex;justify-content:center}
  .canvas{width:660px;max-width:100%;background:var(--panel);border-radius:12px;box-shadow:var(--shadow);padding:30px 34px 60px;position:relative}
  .gap{height:14px;position:relative;margin:2px 0}
  .gap .bar{position:absolute;left:0;right:0;top:6px;height:3px;border-radius:3px;background:transparent}
  .gap.hot .bar{background:var(--link)}
  .gap.hot::after{content:"↳ new linked block";position:absolute;left:0;top:-4px;font-size:11px;color:var(--link);font-weight:600}
  .block{position:relative;border:1px solid transparent;border-radius:8px;padding:8px 10px}
  .block:hover{border-color:var(--line)}
  .block.drop-into{border-color:var(--link);box-shadow:0 0 0 3px var(--link-soft)}
  .block h1.b{font-size:24px;margin:0 0 4px}
  .block p.b{margin:0;font-size:15px;line-height:1.7}
  /* destination doc style presets — linked text adopts one of these, per format */
  .block p.b.heading1{font-size:23px;font-weight:700;line-height:1.25}
  .block p.b.heading2{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
  .block p.b.body1{font-size:15px;line-height:1.7}
  .block p.b.body2{font-size:13px;line-height:1.6;color:var(--muted)}
  .preset-chip{position:absolute;top:4px;right:6px;opacity:0;transition:opacity .12s}
  .block:hover .preset-chip{opacity:1}
  .preset-chip select{font:11px var(--font);border:1px solid var(--line);border-radius:5px;background:var(--panel);color:var(--muted);padding:1px 4px}
  .block img.b{max-width:100%;border-radius:8px;display:block;border:1px solid var(--line)}
  .caret-ghost{display:inline-block;width:2px;height:1.1em;background:var(--link);vertical-align:-2px;margin:0 -1px;animation:blink 1s step-start infinite}
  @keyframes blink{50%{opacity:.2}}
  .lrun{background:var(--link-soft);border-bottom:2px solid var(--link-line);border-radius:2px;padding:0 1px;position:relative}
  .lrun.isalt{background:var(--alt-soft);border-bottom-color:var(--alt-line)}
  .lrun .spanicons{display:inline-flex;gap:2px;margin:0 3px;vertical-align:1px}
  .spanbtn{border:1px solid var(--link-line);background:#fff;color:var(--link);width:19px;height:19px;border-radius:5px;display:inline-grid;place-items:center;padding:0}
  .spanbtn.alt{border-color:var(--alt-line);color:var(--alt)}.spanbtn:hover{background:var(--link-soft)}
  .altbadge{font-size:10px;color:var(--alt);border:1px solid var(--alt-line);background:var(--alt-soft);border-radius:8px;padding:0 5px;margin-left:3px;vertical-align:1px}
  .block .blocklink{position:absolute;top:6px;right:6px;display:flex;gap:4px}

  /* SOURCE stage */
  .srcstage{flex:1;display:flex;min-width:0}
  .srcstage__toc{width:240px;border-right:1px solid var(--line);background:var(--panel);overflow:auto;padding:10px}
  .srcstage__doc{flex:1;overflow:auto;padding:24px 40px}
  .srcstage__doc h2{font-size:20px;margin:20px 0 8px}
  .srcstage__doc h3{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
  .srcstage__doc p{font-size:15px;line-height:1.7;margin:0 0 14px}
  .srcstage__side{width:330px;border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:14px}
  .srcstage__side h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
  .usedrow{border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-bottom:8px;cursor:pointer}
  .usedrow:hover{border-color:var(--accent);background:var(--accent-soft)}
  .usedrow .t{font-weight:600}.usedrow .m{color:var(--muted);font-size:12px;margin-top:2px}
  .altchip{display:inline-block;font-size:11px;border:1px solid var(--alt-line);background:var(--alt-soft);color:var(--alt);border-radius:10px;padding:1px 8px;margin:2px 4px 2px 0;cursor:pointer}
  .src-linked{background:var(--link-soft);border-bottom:2px solid var(--link-line);border-radius:2px;cursor:pointer}

  /* popover / modal */
  .pop{position:fixed;z-index:88;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:10px;min-width:250px;max-width:330px}
  .pop h5{margin:0 0 8px;font-size:13px}
  .pop textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:7px;font:inherit;min-height:58px;resize:vertical}
  .pop .row{display:flex;gap:6px;margin-top:8px;justify-content:flex-end}
  .pop .list{display:flex;flex-direction:column;gap:4px;margin:6px 0}
  .pop .list button{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 9px}
  .pop .list button:hover{border-color:var(--accent);background:var(--accent-soft)}
  .pop .list .cur{border-color:var(--link);background:var(--link-soft)}
  .btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 11px;font-weight:600;color:var(--ink)}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}.btn.ghost{background:transparent}
  .scrim{position:fixed;inset:0;background:rgba(15,20,35,.3);z-index:92;display:grid;place-items:center}
  .modal{background:var(--panel);border-radius:12px;box-shadow:var(--shadow);padding:20px;width:460px;max-width:92vw}
  .modal h3{margin:0 0 6px}.modal .why{color:var(--muted);margin:0 0 14px}
  .modal .opts{display:flex;flex-direction:column;gap:8px}
  .modal .opts button{text-align:left;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
  .modal .opts button:hover{border-color:var(--accent);background:var(--accent-soft)}
  .modal .opts .k{font-weight:700}.modal .opts .d{color:var(--muted);font-size:12.5px;margin-top:2px}
  .modal .cancel{margin-top:12px;text-align:right}

  .devbar{position:fixed;bottom:0;left:0;right:0;z-index:80;background:#11151f;color:#cdd3df;font:12px/1.5 ui-monospace,Menlo,monospace;display:flex;align-items:center;gap:14px;padding:6px 12px}
  .devbar b{color:#fff}.devbar .seg{display:flex;gap:6px;align-items:center}
  .devbar button{border:1px solid #333b4d;background:#1b2130;color:#cdd3df;border-radius:5px;padding:3px 8px}
  .devbar button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .devbar .grow{flex:1}.devbar a{color:#8aa0ff;cursor:pointer}
  .statepop{position:fixed;right:12px;bottom:38px;z-index:80;width:380px;max-height:52vh;overflow:auto;background:#0d1017;color:#b9c2d0;border:1px solid #262c3a;border-radius:8px;padding:10px;font:11px/1.45 ui-monospace,Menlo,monospace;white-space:pre-wrap;display:none}
  .statepop.on{display:block}
  .toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);z-index:94;background:#1b2130;color:#fff;padding:8px 14px;border-radius:8px;box-shadow:var(--shadow);font-size:13px;opacity:0;transition:opacity .18s,transform .18s}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(-4px)}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">Verso <small>· linking prototype</small></div>
    <div class="stage-switch" id="stageSwitch">
      <button data-stage="edit" class="on">Edit</button>
      <button data-stage="source">Source</button>
    </div>
    <div class="spacer"></div>
    <div class="hint" id="hint">Select text in the left Source panel — a “Drag to link” bar appears.</div>
  </div>

  <div class="stage on" id="stage-edit">
    <aside class="lpanel">
      <div class="lpanel__tabs">
        <button class="lpanel__tab">Structure</button>
        <button class="lpanel__tab">Blocks</button>
        <button class="lpanel__tab on">Source</button>
      </div>
      <div class="srcsearch">
        <svg class="icon"><use href="#i-search"/></svg>
        <input id="srcFind" placeholder="Search source…">
        <div class="nav" id="findNav" hidden><span id="findCount">0</span>
          <button id="findPrev"><svg class="icon"><use href="#i-up"/></svg></button>
          <button id="findNext"><svg class="icon"><use href="#i-down"/></svg></button>
        </div>
      </div>
      <div class="toc" id="panelToc"></div>
      <div class="srcdoc" id="panelDoc"></div>
    </aside>
    <main class="canvaswrap"><div class="canvas" id="canvas"></div></main>
  </div>

  <div class="stage" id="stage-source">
    <div class="srcstage">
      <div class="srcstage__toc" id="srcStageToc"></div>
      <div class="srcstage__doc" id="srcStageDoc"></div>
      <div class="srcstage__side"><h4>Links &amp; alternates</h4><div id="srcStageSide"></div></div>
    </div>
  </div>
</div>

<div class="devbar">
  <span class="seg"><b>Prototype</b> · cross-stage linking</span>
  <span class="seg">indicator:
    <button class="tog on" data-tog="ind" data-val="icon">highlight+icon</button>
    <button class="tog" data-tog="ind" data-val="hl">highlight only</button></span>
  <span class="seg">panel links:
    <button class="tog on" data-tog="dim" data-val="show">show</button>
    <button class="tog" data-tog="dim" data-val="dim">dim</button></span>
  <span class="grow"></span>
  <a id="editSrcBtn">✎ simulate a source base edit</a>
  <a id="toggleState">state ▾</a>
</div>
<pre class="statepop" id="statePop"></pre>
<div class="toast" id="toast"></div>
<div class="selbar" id="selBar"></div>

<svg width="0" height="0" style="position:absolute"><defs>
  <g id="i-search"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></g>
  <g id="i-link"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></g>
  <g id="i-fork"><circle cx="6" cy="5" r="2"/><circle cx="18" cy="5" r="2"/><circle cx="12" cy="20" r="2"/><path d="M6 7v3a4 4 0 0 0 4 4h4a4 4 0 0 0 4-4V7"/><path d="M12 14v4"/></g>
  <g id="i-grip"><circle cx="9" cy="6" r="1.4"/><circle cx="15" cy="6" r="1.4"/><circle cx="9" cy="12" r="1.4"/><circle cx="15" cy="12" r="1.4"/><circle cx="9" cy="18" r="1.4"/><circle cx="15" cy="18" r="1.4"/></g>
  <g id="i-up"><path d="M18 15l-6-6-6 6"/></g><g id="i-down"><path d="M6 9l6 6 6-6"/></g>
</defs></svg>

<script>
(function(){
"use strict";
// ---- MOCK DATA (neutral placeholder only) ----
var sourceDoc={nodes:[
  {key:"c1",type:"heading",level:1,text:"Product Overview"},
  {key:"p1",type:"paragraph",text:"The Model X sensor calibrates itself automatically the first time it powers on, so no manual setup is needed before the first patrol."},
  {key:"p2",type:"paragraph",text:"Detection range extends to roughly 3 kilometres in open terrain and adapts to weather conditions in real time."},
  {key:"c2",type:"heading",level:1,text:"Field Operation"},
  {key:"h1",type:"heading",level:2,text:"Deployment"},
  {key:"p3",type:"paragraph",text:"Mount the unit on any standard tripod. A single operator can deploy the full kit in under two minutes."},
  {key:"img1",type:"image",src:"data:image/svg+xml;utf8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="320" height="150"><rect width="320" height="150" fill="#dfe6f5"/><text x="160" y="80" font-family="sans-serif" font-size="15" fill="#5b6b90" text-anchor="middle">Deployment diagram</text></svg>'),alt:"Deployment diagram"},
  {key:"p4",type:"paragraph",text:"After deployment the operator confirms a green status light before leaving the position unattended."},
  {key:"c3",type:"heading",level:1,text:"Maintenance"},
  {key:"p5",type:"paragraph",text:"Wipe the lens weekly with a dry microfibre cloth. Do not use solvents, which can degrade the coating over time."}
]};
var course={blocks:[
  {id:"b1",type:"heading",text:"Feature Presentation"},
  {id:"b2",type:"text",runs:[{text:"Our product leads the category. "}]},
  {id:"b3",type:"text",runs:[{text:"Key differentiators are covered in the sections that follow."}]}
]};
var links={},linkSeq=0,altSeq=0,blkSeq=100;
function mkId(p){return p+(++linkSeq);}
function runText(run){ if(run.text!=null)return run.text; var lk=links[run.linkId]; if(!lk)return""; if(run.altId){var a=lk.alternates.find(function(x){return x.id===run.altId;});if(a)return a.text;} return lk.baseText; }
function nodeByKey(k){return sourceDoc.nodes.find(function(n){return n.key===k;});}
function blockById(id){return course.blocks.find(function(b){return b.id===id;});}
function canvasElById(id){return canvas.querySelector('[data-block="'+id+'"]');}

var ui={stage:"edit",indicator:"icon",dimLinks:false,drag:null,find:{q:"",hits:[],i:0}};

var panelDoc=document.getElementById("panelDoc"), panelToc=document.getElementById("panelToc"), canvas=document.getElementById("canvas");

// ---- PANEL render ----
function linkedRangesForNode(nodeKey){
  var out=[];
  Object.keys(links).forEach(function(id){ var lk=links[id];
    if(lk.kind!=="text"||!lk.locations.some(function(l){return l.docId==="thisdoc";})) return;
    (lk.nodeRanges||[]).forEach(function(r){ if(r.nodeKey===nodeKey) out.push({start:r.start,len:r.len,id:id}); });
  });
  return out.sort(function(a,b){return a.start-b.start;});
}
function renderSourceText(node){
  var text=node.text,ranges=linkedRangesForNode(node.key),frag=document.createDocumentFragment(),pos=0;
  ranges.forEach(function(r){ if(r.start>pos)frag.appendChild(document.createTextNode(text.slice(pos,r.start)));
    var span=document.createElement("span");span.className="linked";span.dataset.linkId=r.id;span.textContent=text.slice(r.start,r.start+r.len);span.title="Linked into this document — click to see where";frag.appendChild(span);pos=r.start+r.len;});
  if(pos<text.length)frag.appendChild(document.createTextNode(text.slice(pos))); return frag;
}
function renderPanel(){
  reconcileLocations(); // keep where-used current so already-linked spans highlight
  panelDoc.innerHTML="";panelToc.innerHTML=""; panelDoc.classList.toggle("dimlinks",ui.dimLinks);
  sourceDoc.nodes.forEach(function(n){
    if(n.type==="heading"){
      var t=document.createElement(n.level===1?"h2":"h3");t.dataset.node=n.key;t.appendChild(renderSourceText(n));panelDoc.appendChild(t);
      var row=document.createElement("button");row.className="toc__row "+(n.level===1?"chap":"sub");row.textContent=n.text;
      row.onclick=function(){var el=panelDoc.querySelector('[data-node="'+n.key+'"]');if(el)el.scrollIntoView({behavior:"smooth",block:"start"});};
      panelToc.appendChild(row);
    } else if(n.type==="image"){
      var fig=document.createElement("figure");fig.dataset.node=n.key;
      var im=document.createElement("img");im.src=n.src;im.alt=n.alt;fig.appendChild(im);
      var cap=document.createElement("figcaption");cap.textContent=n.alt;fig.appendChild(cap);
      var grab=document.createElement("button");grab.className="fig-grab";grab.innerHTML='<svg class="icon"><use href="#i-grip"/></svg> Drag to link';
      grab.addEventListener("pointerdown",function(e){e.preventDefault();beginPointerDrag(e,{kind:"image",nodeKey:n.key,label:n.alt});});
      fig.appendChild(grab); panelDoc.appendChild(fig);
    } else {
      var p=document.createElement("p");p.dataset.node=n.key;p.appendChild(renderSourceText(n));panelDoc.appendChild(p);
    }
  });
  applyFind();
}

// ---- SELECTION -> floating sel-bar ----
var pendingSel=null,armed=false,selBar=document.getElementById("selBar");
function nodeIndex(key){ for(var i=0;i<sourceDoc.nodes.length;i++){ if(sourceDoc.nodes[i].key===key) return i; } return -1; }
function elForNode(container){ var el=container.nodeType===3?container.parentElement:container; return el&&el.closest?el.closest("[data-node]"):null; }
function charOffset(nodeEl,container,offset){ var r=document.createRange(); r.setStart(nodeEl,0); r.setEnd(container,offset); return r.toString().length; }
// Cross-node selection -> a multi-node range payload (mirrors the source stage's single-host
// selection: not clamped to one paragraph). Walks every text node the selection touches,
// heading/subheading/paragraph alike, and records each node's covered [start,len].
function currentSelRange(){
  var sel=window.getSelection(); if(!sel||sel.isCollapsed||!sel.rangeCount) return null;
  var range=sel.getRangeAt(0);
  var startEl=elForNode(range.startContainer), endEl=elForNode(range.endContainer);
  if(!startEl||!endEl||!panelDoc.contains(startEl)||!panelDoc.contains(endEl)) return null;

  panelDoc.querySelectorAll("p,h2,h3").forEach(function(el){highlightIn(el,q);});
  ui.find.hits=Array.prototype.slice.call(panelDoc.querySelectorAll(".findhit"));
  findNav.hidden=ui.find.hits.length===0;findCount.textContent=ui.find.hits.length?(ui.find.i+1)+"/"+ui.find.hits.length:"0";markHit();
}
function highlightIn(el,q){
  Array.prototype.slice.call(el.childNodes).forEach(function(cn){
    if(cn.nodeType!==3)return;var txt=cn.nodeValue,low=txt.toLowerCase(),idx=low.indexOf(q);if(idx<0)return;
    var frag=document.createDocumentFragment(),pos=0;
    while(idx>=0){if(idx>pos)frag.appendChild(document.createTextNode(txt.slice(pos,idx)));var s=document.createElement("span");s.className="findhit";s.textContent=txt.slice(idx,idx+q.length);frag.appendChild(s);pos=idx+q.length;idx=low.indexOf(q,pos);}
    if(pos<txt.length)frag.appendChild(document.createTextNode(txt.slice(pos)));cn.replaceWith(frag);
  });
}
function cycleFind(d){if(!ui.find.hits.length)return;ui.find.i=(ui.find.i+d+ui.find.hits.length)%ui.find.hits.length;findCount.textContent=(ui.find.i+1)+"/"+ui.find.hits.length;markHit();}
function markHit(){ui.find.hits.forEach(function(h,i){h.style.outline=i===ui.find.i?"2px solid var(--accent)":"";});var c=ui.find.hits[ui.find.i];if(c)c.scrollIntoView({block:"center",behavior:"smooth"});}

// ---- stage/toggles/state ----
function setStage(s){ui.stage=s;document.querySelectorAll(".stage").forEach(function(el){el.classList.remove("on");});document.getElementById("stage-"+s).classList.add("on");document.querySelectorAll("#stageSwitch button").forEach(function(b){b.classList.toggle("on",b.dataset.stage===s);});if(s==="source")renderSourceStage();}
document.getElementById("stageSwitch").addEventListener("click",function(e){var b=e.target.closest("button");if(b)setStage(b.dataset.stage);});
document.querySelectorAll(".devbar .tog").forEach(function(t){t.onclick=function(){var g=t.dataset.tog;document.querySelectorAll('.tog[data-tog="'+g+'"]').forEach(function(x){x.classList.toggle("on",x===t);});if(g==="ind")ui.indicator=t.dataset.val;if(g==="dim")ui.dimLinks=(t.dataset.val==="dim");renderCanvas();renderPanel();};});
var statePop=document.getElementById("statePop");
document.getElementById("toggleState").onclick=function(){statePop.classList.toggle("on");refreshState();};
function refreshState(){reconcileLocations();if(!statePop.classList.contains("on"))return;
  var view={links:Object.keys(links).map(function(k){var l=links[k];return{id:l.id,kind:l.kind,base:trunc(l.baseText,28),alts:l.alternates.length,usedIn:l.locations.length};}),
    blocks:course.blocks.map(function(b){return b.type==="text"?{id:b.id,type:"text",runs:b.runs.map(function(r){return r.text!=null?("owned:“"+trunc(r.text,12)+"”"):("LINK "+r.linkId+(r.altId?("/"+r.altId):"/base"));})}:{id:b.id,type:b.type,link:b.linkId||null};})};
  statePop.textContent=JSON.stringify(view,null,2);}
function esc(s){return (s||"").replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function trunc(s,n){s=s||"";return s.length>n?s.slice(0,n)+"…":s;}
function flash(el){el.animate([{boxShadow:"0 0 0 3px var(--accent-soft)"},{boxShadow:"0 0 0 6px transparent"}],{duration:900});}
var toastEl=document.getElementById("toast"),toastT=null;
function toast(m){toastEl.textContent=m;toastEl.classList.add("on");clearTimeout(toastT);toastT=setTimeout(function(){toastEl.classList.remove("on");},2600);}
function showHint(m){document.getElementById("hint").textContent=m;}

// expose a couple hooks for headless verification
window.__proto={dropAtGap:dropAtGap,beginPointerDrag:beginPointerDrag,makeLink:makeLink,setDrag:function(p){ui.drag=p;},course:course,links:links,renderCanvas:renderCanvas};

renderPanel();renderCanvas();refreshState();
})();
</script>
</body>
