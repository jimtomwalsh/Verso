<!--
  PROTOTYPE — throwaway. Not wired into the real app, not shipped.
  Question: does the DaVinci-style 3-stage rail (Source / Edit / Publish)
  + persistent Product filter + top-bar tabs + Source wiki layout
  feel right to navigate, before locking a real spec?
  Round 2 — revised per James's first-pass notes (variant pills as filters,
  flowing wiki content, top-bar tabs, 3-pane Publish).
  Run: open this file directly in a browser. No build step.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Verso — IA Prototype</title>
<style>
  /* ===== DSLMS tokens (copied from design-system/tokens/*.css) ===== */
  :root{
    --gray-1000:#171717; --gray-950:#1e1e1e; --gray-900:#262626; --gray-850:#2c2c2c;
    --gray-800:#363636; --gray-750:#444444; --gray-700:#525252; --gray-600:#6b6b6b;
    --gray-500:#808080; --gray-400:#a3a3a3; --gray-300:#b3b3b3; --gray-200:#cfcfcf;
    --gray-100:#e6e6e6; --gray-050:#f5f5f5; --white:#fff; --black:#000;
    --alpha-hover:rgba(255,255,255,.06); --alpha-active:rgba(255,255,255,.10);
    --alpha-border:rgba(255,255,255,.10); --alpha-border-strong:rgba(255,255,255,.16);
    --blue-500:#0d99ff; --blue-600:#007be5; --blue-700:#005bb5; --blue-tint:rgba(13,153,255,.16);
    --green-500:#14ae5c; --green-tint:rgba(20,174,92,.16);
    --red-500:#f24822; --red-tint:rgba(242,72,34,.16);
    --yellow-500:#ffcd29; --purple-500:#9747ff; --teal-500:#0e9384;

    --surface-canvas:var(--gray-1000); --surface-app:var(--gray-950); --surface-panel:var(--gray-950);
    --surface-raised:var(--gray-900); --surface-input:var(--gray-850);
    --surface-hover:var(--alpha-hover); --surface-active:var(--alpha-active); --surface-selected:var(--blue-tint);
    --text-primary:var(--gray-100); --text-secondary:var(--gray-300); --text-tertiary:var(--gray-500);
    --text-disabled:var(--gray-600); --text-on-accent:#fff; --text-link:var(--blue-500);
    --icon-idle:var(--gray-400); --icon-strong:var(--gray-100); --icon-on-accent:#fff;
    --border-subtle:var(--alpha-border); --border-strong:var(--alpha-border-strong);
    --border-input:var(--gray-750); --border-focus:var(--blue-500);
    --accent:var(--blue-500); --accent-hover:var(--blue-600); --accent-pressed:var(--blue-700);
    --accent-quiet:var(--blue-tint); --success:var(--green-500); --danger:var(--red-500);
    --danger-tint:var(--red-tint); --warning:var(--yellow-500); --component:var(--purple-500);

    --space-1:2px; --space-2:4px; --space-3:6px; --space-4:8px; --space-5:10px;
    --space-6:12px; --space-8:16px; --space-10:20px; --space-12:24px; --space-16:32px;
    --control-sm:20px; --control-md:24px; --control-lg:32px;
    --icon-sm:12px; --icon-md:16px; --icon-lg:20px;
    --panel-left-width:248px; --panel-right-width:264px;
    --rail-width:48px; --toolbar-height:40px;

    --font-ui:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-brand:"Exo 2",var(--font-ui);
    --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --text-2xs:10px; --text-xs:11px; --text-sm:12px; --text-md:13px; --text-lg:16px; --text-xl:20px;
    --weight-regular:400; --weight-medium:500; --weight-semibold:600;
    --tracking-caps:.06em;

    --radius-xs:2px; --radius-sm:4px; --radius-md:6px; --radius-lg:8px; --radius-full:999px;
    --shadow-popover:0 2px 5px rgba(0,0,0,.28),0 0 0 1px var(--border-subtle);
    --shadow-menu:0 4px 12px rgba(0,0,0,.36),0 0 0 1px var(--border-subtle);
    --ease-out:cubic-bezier(0,0,.2,1); --dur-fast:120ms; --dur-base:180ms;
  }
  /* Verso is dark-first — commit to it as the base; light is the scoped override */
  @media (prefers-color-scheme:light){
    :root:not([data-theme="dark"]){
      --surface-canvas:#e5e5e5; --surface-app:#fff; --surface-panel:#fff; --surface-raised:#fff;
      --surface-input:#f5f5f5; --surface-hover:rgba(0,0,0,.05); --surface-active:rgba(0,0,0,.08);
      --surface-selected:rgba(13,153,255,.12);
      --text-primary:#1e1e1e; --text-secondary:#4d4d4d; --text-tertiary:#8c8c8c; --text-disabled:#b3b3b3;
      --icon-idle:#6b6b6b; --icon-strong:#1e1e1e;
      --border-subtle:rgba(0,0,0,.08); --border-strong:rgba(0,0,0,.14); --border-input:#d9d9d9;
      --accent-quiet:rgba(13,153,255,.12);
    }
  }
  :root[data-theme="light"]{
    --surface-canvas:#e5e5e5; --surface-app:#fff; --surface-panel:#fff; --surface-raised:#fff;
    --surface-input:#f5f5f5; --surface-hover:rgba(0,0,0,.05); --surface-active:rgba(0,0,0,.08);
    --surface-selected:rgba(13,153,255,.12);
    --text-primary:#1e1e1e; --text-secondary:#4d4d4d; --text-tertiary:#8c8c8c; --text-disabled:#b3b3b3;
    --icon-idle:#6b6b6b; --icon-strong:#1e1e1e;
    --border-subtle:rgba(0,0,0,.08); --border-strong:rgba(0,0,0,.14); --border-input:#d9d9d9;
    --accent-quiet:rgba(13,153,255,.12);
  }
  :root[data-theme="dark"]{
    --surface-canvas:var(--gray-1000); --surface-app:var(--gray-950); --surface-panel:var(--gray-950);
    --surface-raised:var(--gray-900); --surface-input:var(--gray-850);
    --surface-hover:var(--alpha-hover); --surface-active:var(--alpha-active); --surface-selected:var(--blue-tint);
    --text-primary:var(--gray-100); --text-secondary:var(--gray-300); --text-tertiary:var(--gray-500);
    --icon-idle:var(--gray-400); --icon-strong:var(--gray-100);
    --border-subtle:var(--alpha-border); --border-strong:var(--alpha-border-strong); --border-input:var(--gray-750);
    --accent-quiet:var(--blue-tint);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--surface-canvas); color:var(--text-primary);
    font:var(--weight-regular) var(--text-xs)/1.4 var(--font-ui);
    -webkit-font-smoothing:antialiased; overflow:hidden;
  }
  button{font:inherit; color:inherit; background:none; border:0; cursor:pointer;}
  select,textarea{font:inherit; color:inherit;}
  svg{display:block;}

  /* ---- Prototype-only chrome (clearly not the design being judged) ---- */
  .proto-badge{
    position:fixed; top:8px; right:8px; z-index:50;
    background:var(--warning); color:#1e1e1e; font-weight:var(--weight-semibold);
    font-size:var(--text-2xs); letter-spacing:var(--tracking-caps); text-transform:uppercase;
    padding:3px 8px; border-radius:var(--radius-full); box-shadow:var(--shadow-popover);
    pointer-events:none;
  }
  .scope-note{
    display:flex; align-items:center; justify-content:center; text-align:center;
    height:100%; color:var(--text-tertiary); font-size:var(--text-xs);
    border:1px dashed var(--border-strong); border-radius:var(--radius-md); padding:var(--space-8);
  }

  /* ===== App shell ===== */
  .app{ height:100vh; display:flex; flex-direction:column; }

  /* ---- Top bar (brand, product filter, tabs when editing, save state) ---- */
  .topbar{
    height:var(--toolbar-height); flex:0 0 auto; display:flex; align-items:center;
    gap:var(--space-6); padding:0 var(--space-8);
    background:var(--surface-app); border-bottom:1px solid var(--border-subtle);
  }
  .brand{ font:var(--weight-semibold) var(--text-md) var(--font-brand); color:var(--text-primary); letter-spacing:-.01em; flex:0 0 auto; }
  .product-picker{ position:relative; flex:0 0 auto; }
  .product-picker select{
    appearance:none; height:var(--control-md); padding:0 var(--space-10) 0 var(--space-6);
    background:var(--surface-input); border:1px solid var(--border-input); border-radius:var(--radius-sm);
    color:var(--text-primary); font-size:var(--text-xs); min-width:168px;
  }
  .product-picker::after{
    content:""; position:absolute; right:var(--space-3); top:50%; width:8px; height:8px;
    transform:translateY(-60%) rotate(45deg); border-right:1.4px solid var(--icon-idle); border-bottom:1.4px solid var(--icon-idle);
    pointer-events:none;
  }
  .topbar-divider{ width:1px; align-self:stretch; margin:var(--space-4) 0; background:var(--border-subtle); flex:0 0 auto; }
  .topbar-spacer{ flex:1; min-width:var(--space-4); }
  .topbar-right{ display:flex; align-items:center; gap:var(--space-4); color:var(--text-tertiary); font-size:var(--text-2xs); flex:0 0 auto; }
  .save-dot{ width:6px; height:6px; border-radius:50%; background:var(--success); }

  /* ---- Doc tabs — live in the top bar, Edit stage only ---- */
  .topbar-tabs{ display:flex; align-items:center; gap:2px; overflow-x:auto; max-width:46vw; flex:0 1 auto; scrollbar-width:none; }
  .topbar-tabs::-webkit-scrollbar{ display:none; }
  .ttab{
    display:flex; align-items:center; gap:6px; height:26px; padding:0 var(--space-3) 0 var(--space-5);
    border-radius:var(--radius-sm); font-size:var(--text-xs); color:var(--text-secondary);
    white-space:nowrap; flex:0 0 auto; max-width:220px;
  }
  .ttab span{ overflow:hidden; text-overflow:ellipsis; }
  .ttab svg{ width:12px; height:12px; stroke:currentColor; flex:0 0 auto; }
  .ttab:hover{ background:var(--surface-hover); color:var(--text-primary); }
  .ttab.is-active{ background:var(--surface-selected); color:var(--accent); }
  .tab-close{ opacity:0; width:14px; height:14px; border-radius:3px; display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
  .ttab:hover .tab-close{ opacity:1; }
  .tab-close:hover{ background:var(--surface-active); }
  .tab-close svg{ width:9px; height:9px; stroke:currentColor; }
  .tab-new{ width:22px; height:22px; margin-left:2px; border-radius:var(--radius-sm); display:flex; align-items:center; justify-content:center; color:var(--icon-idle); flex:0 0 auto; }
  .tab-new:hover{ background:var(--surface-hover); color:var(--icon-strong); }
  .tab-new svg{ width:13px; height:13px; stroke:currentColor; }

  /* ---- Body row: rail + workspace ---- */
  .body{ flex:1; display:flex; min-height:0; }

  .rail{
    width:var(--rail-width); flex:0 0 auto; background:var(--surface-app);
    border-right:1px solid var(--border-subtle); display:flex; flex-direction:column;
    align-items:center; padding:var(--space-6) 0; gap:var(--space-2);
  }
  .rail-stage{
    width:36px; height:36px; border-radius:var(--radius-sm); display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:3px; color:var(--icon-idle);
    position:relative;
  }
  .rail-stage svg{ width:var(--icon-md); height:var(--icon-md); stroke:currentColor; }
  .rail-stage span{ font-size:8px; letter-spacing:.01em; }
  .rail-stage:hover{ background:var(--surface-hover); color:var(--icon-strong); }
  .rail-stage.is-active{ background:var(--surface-selected); color:var(--accent); }
  .rail-stage.is-active::before{
    content:""; position:absolute; left:-1px; top:6px; bottom:6px; width:2px;
    background:var(--accent); border-radius:var(--radius-full);
  }
  .rail-spacer{ flex:1; }
  .rail-actions{ display:flex; flex-direction:column; align-items:center; gap:var(--space-4); padding-top:var(--space-4); border-top:1px solid var(--border-subtle); width:100%; }
  .rail-action{ width:28px; height:28px; border-radius:var(--radius-sm); display:flex; align-items:center; justify-content:center; color:var(--icon-idle); }
  .rail-action svg{ width:var(--icon-md); height:var(--icon-md); stroke:currentColor; }
  .rail-action:hover{ background:var(--surface-hover); color:var(--icon-strong); }

  .workspace{ flex:1; display:flex; flex-direction:column; min-width:0; }

  /* ---- Generic 3-pane stage frame (all three stages share this) ---- */
  .stage{ flex:1; display:flex; min-height:0; }
  .pane{ background:var(--surface-panel); min-height:0; display:flex; flex-direction:column; }
  .pane-left{ width:var(--panel-left-width); flex:0 0 auto; border-right:1px solid var(--border-subtle); }
  .pane-right{ width:var(--panel-right-width); flex:0 0 auto; border-left:1px solid var(--border-subtle); }
  .pane-main{ flex:1; min-width:0; background:var(--surface-canvas); overflow:auto; }
  .pane-header{
    height:34px; flex:0 0 auto; display:flex; align-items:center; padding:0 var(--space-6);
    font:var(--weight-semibold) var(--text-2xs)/1 var(--font-ui); letter-spacing:var(--tracking-caps);
    text-transform:uppercase; color:var(--text-tertiary); border-bottom:1px solid var(--border-subtle); gap:var(--space-4);
  }
  .pane-body{ flex:1; overflow:auto; padding:var(--space-4); }

  .search-input{
    display:flex; align-items:center; gap:var(--space-3); height:var(--control-md);
    background:var(--surface-input); border:1px solid var(--border-input); border-radius:var(--radius-sm);
    padding:0 var(--space-4); margin:var(--space-4); color:var(--text-tertiary);
  }
  .search-input svg{ width:var(--icon-sm); height:var(--icon-sm); stroke:currentColor; flex:0 0 auto; }
  .search-input input{ border:0; background:none; outline:0; color:var(--text-primary); font:inherit; width:100%; }
  .search-input input::placeholder{ color:var(--text-tertiary); }

  /* Lightweight markdown output — shared by wiki sections, Edit-panel
     excerpts and canvas blocks, so topic content can carry real structure
     (bold, inline tags, bullets) and read as an independent doc. */
  .md p{ margin:0 0 var(--space-4); }
  .md p:last-child{ margin-bottom:0; }
  .md ul{ margin:0 0 var(--space-4); padding-left:1.15em; }
  .md ul:last-child{ margin-bottom:0; }
  .md li{ margin-bottom:4px; }
  .inline-tag{ display:inline-block; background:var(--surface-input); border:1px solid var(--border-input); border-radius:var(--radius-xs); padding:0 5px; font-family:var(--font-mono); font-size:.92em; color:var(--text-primary); }

  .btn{ height:var(--control-lg); padding:0 var(--space-8); border-radius:var(--radius-sm); font-size:var(--text-xs); font-weight:var(--weight-medium); display:inline-flex; align-items:center; justify-content:center; gap:6px; }
  .btn-primary{ background:var(--accent); color:#fff; }
  .btn-primary:hover{ background:var(--accent-hover); }
  .btn-primary:disabled{ background:var(--gray-700); color:var(--text-disabled); cursor:default; }
  .btn-ghost{ border:1px solid var(--border-input); color:var(--text-secondary); }
  .btn-ghost:hover{ color:var(--text-primary); border-color:var(--border-strong); }
  .btn-sm{ height:22px; padding:0 8px; font-size:10px; }
  .btn svg{ width:13px; height:13px; stroke:currentColor; }

  /* ---- Source (Ground Truth) — topic nav ---- */
  .gt-group-label{ padding:var(--space-4) var(--space-6) var(--space-2); font-size:var(--text-2xs); letter-spacing:var(--tracking-caps); text-transform:uppercase; color:var(--text-tertiary); }
  .gt-topic-wrap{ margin:0 var(--space-3); }
  .gt-topic{
    display:flex; align-items:center; gap:var(--space-4); height:28px; padding:0 var(--space-6);
    color:var(--text-secondary); border-radius:var(--radius-sm);
  }
  .gt-topic svg{ width:14px; height:14px; stroke:currentColor; flex:0 0 auto; color:var(--icon-idle); }
  .gt-topic:hover{ background:var(--surface-hover); color:var(--text-primary); }
  .gt-topic.is-active{ background:var(--surface-selected); color:var(--accent); }
  .gt-topic.is-active svg{ color:var(--accent); }
  .gt-topic-cross{ margin-left:auto; font-size:9px; color:var(--purple-500); border:1px solid currentColor; border-radius:var(--radius-full); padding:0 4px; flex:0 0 auto; }
  .gt-expand-chevron{ width:10px !important; height:10px !important; margin-left:var(--space-2); flex:0 0 auto; transition:transform var(--dur-fast) var(--ease-out); color:var(--icon-idle) !important; }
  .gt-expand-chevron.is-open{ transform:rotate(90deg); }

  .gt-main-head{ padding:var(--space-8) var(--space-10) var(--space-6); border-bottom:1px solid var(--border-subtle); background:var(--surface-panel); }
  .gt-crumb{ font-size:var(--text-2xs); color:var(--text-tertiary); text-transform:uppercase; letter-spacing:var(--tracking-caps); margin-bottom:var(--space-2); }
  .gt-title{ font:var(--weight-semibold) var(--text-lg)/1.2 var(--font-ui); margin-bottom:var(--space-6); }
  .gt-controls-row{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:var(--space-6) var(--space-10); }
  .variant-toggles{ display:flex; align-items:center; gap:var(--space-3); flex-wrap:wrap; }
  .vt-label{ font-size:var(--text-2xs); color:var(--text-tertiary); text-transform:uppercase; letter-spacing:var(--tracking-caps); margin-right:2px; }
  .facet-row{ display:flex; align-items:center; gap:var(--space-3); }
  .chip{
    height:var(--control-sm); padding:0 var(--space-5); border-radius:var(--radius-full);
    border:1px solid var(--border-input); color:var(--text-secondary); font-size:var(--text-xs);
    display:flex; align-items:center; gap:5px;
  }
  .chip:hover{ border-color:var(--border-strong); color:var(--text-primary); }
  .chip.is-on{ background:var(--accent-quiet); border-color:var(--accent); color:var(--accent); }
  .chip-dot{ width:6px; height:6px; border-radius:50%; background:currentColor; }
  .facet-toggle{ display:flex; gap:2px; background:var(--surface-input); border-radius:var(--radius-sm); padding:2px; }
  .facet-toggle button{ padding:2px 7px; border-radius:3px; font-size:10px; color:var(--text-tertiary); }
  .facet-toggle button.is-on{ background:var(--surface-raised); color:var(--text-primary); }

  /* Flowing wiki article — the content itself, not boxed cards.
     A section only breaks into variant columns when a toggled-on variant
     actually diverges from Flagship there; otherwise it stays single-column
     so the page doesn't fill with duplicated, identical content. */
  .gt-body{ padding:var(--space-10) var(--space-12); max-width:760px; }
  .wiki-section{ margin-bottom:var(--space-12); font-size:var(--text-sm); color:var(--text-secondary); line-height:1.75; }
  .wiki-section h4{ margin:0 0 var(--space-3); font:var(--weight-semibold) var(--text-md); color:var(--text-primary); }
  .wiki-section-headrow{ display:flex; align-items:baseline; justify-content:space-between; gap:var(--space-6); margin-bottom:var(--space-3); }
  .wiki-section-headrow h4{ margin:0; }
  .variant-badge{ font-size:10px; color:var(--teal-500); white-space:nowrap; flex:0 0 auto; }
  .wiki-variant-split{ display:grid; gap:0; border:1px solid var(--border-subtle); border-radius:var(--radius-md); overflow:hidden; background:var(--surface-raised); }
  .wiki-variant-col{ padding:var(--space-5) var(--space-6); }
  .wiki-variant-col + .wiki-variant-col{ border-left:1px solid var(--border-subtle); }
  .wiki-variant-col-label{ font:var(--weight-semibold) 10px/1; text-transform:uppercase; letter-spacing:var(--tracking-caps); color:var(--text-tertiary); margin-bottom:var(--space-3); }

  /* Select-to-reference affordance (open question — not a real mechanic yet) */
  .select-ref-btn{
    position:fixed; transform:translate(-50%,-100%); display:none; align-items:center; gap:5px;
    background:var(--surface-raised); border:1px solid var(--border-strong); box-shadow:var(--shadow-popover);
    border-radius:var(--radius-full); padding:5px 11px; font-size:10px; color:var(--text-primary); z-index:60;
  }
  .select-ref-btn svg{ width:11px; height:11px; stroke:var(--accent); }
  .select-ref-btn:hover{ border-color:var(--accent); }

  /* Source info panel (right, Source stage) */
  .gt-info-block{ margin-bottom:var(--space-10); }
  .gt-info-label{ font-size:10px; text-transform:uppercase; letter-spacing:var(--tracking-caps); color:var(--text-tertiary); margin-bottom:var(--space-4); }
  .gt-info-row{ display:flex; align-items:center; justify-content:space-between; gap:var(--space-3); padding:var(--space-3) 0; border-bottom:1px solid var(--border-subtle); }
  .gt-info-row:last-child{ border-bottom:0; }
  .gt-info-doc{ font-size:var(--text-xs); color:var(--text-primary); }
  .gt-info-sub{ font-size:10px; color:var(--text-tertiary); margin-top:1px; }
  .gt-info-jump{ width:11px !important; height:11px !important; stroke:var(--icon-idle) !important; flex:0 0 auto; }
  .gt-info-line{ font-size:var(--text-xs); color:var(--text-secondary); margin-bottom:var(--space-3); }
  .gt-info-line b{ color:var(--text-primary); font-weight:var(--weight-medium); }

  /* ---- Edit stage ---- */
  .lpane-tabs{ display:flex; border-bottom:1px solid var(--border-subtle); }
  .lpane-tabs button{ flex:1; padding:var(--space-4) 0; font-size:var(--text-2xs); text-transform:uppercase; letter-spacing:var(--tracking-caps); color:var(--text-tertiary); border-bottom:2px solid transparent; }
  .lpane-tabs button.is-on{ color:var(--text-primary); border-color:var(--accent); }

  .block-outline{ padding:var(--space-3); display:flex; flex-direction:column; gap:1px; }
  .block-row{ display:flex; align-items:center; gap:var(--space-3); height:26px; padding:0 var(--space-4); border-radius:var(--radius-sm); color:var(--text-secondary); }
  .block-row:hover{ background:var(--surface-hover); }
  .block-row.is-active{ background:var(--surface-selected); color:var(--accent); }

  .src-excerpt-list{ margin:2px var(--space-3) var(--space-4); display:flex; flex-direction:column; gap:6px; }

<script>

function icon(name, cls=""){
  return `<svg class="${cls}" viewBox="0 0 16 16" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">${ICON[name]||""}</svg>`;

/* ---------------------------------------------------------------------
   Fictional, hygiene-safe sample content (generic industrial hardware
   documentation — no real products, no proprietary terminology).
--------------------------------------------------------------------- */
const PRODUCTS = [
  { id:"meridian", name:"Meridian 400", color:"#0d99ff" },
  { id:"solace",   name:"Solace X2",    color:"#9747ff" },
];

const GT_TOPICS = [
  { id:"power",      title:"Power Requirements",       product:"meridian", icon:"fileText", cross:false },
  { id:"mounting",   title:"Mounting & Enclosure",      product:"meridian", icon:"fileText", cross:false },
  { id:"firmware",   title:"Firmware Update Procedure", product:"meridian", icon:"fileText", cross:true  },
  { id:"calibration",title:"Sensor Calibration",        product:"solace",   icon:"fileText", cross:false },
  { id:"interlocks", title:"Safety Interlocks",         product:"solace",   icon:"fileText", cross:true  },
  { id:"tour",       title:"Enclosure Screen Tour",     product:"meridian", icon:"hotspot",  cross:false },
];

// Flagship is the base reading everyone gets — these pills are the only
// candidate divergences (Verso's existing variant vocabulary), toggled
// on to compare against Flagship.
const VARIANTS = { meridian:["Extended Range","Compact"], solace:["Extended Range","Compact"] };

// Multi-section wiki content — a topic is several headed sections, not one
// block. `variants` is deliberately sparse: most sections carry none, so
// toggling a variant pill shows no difference there (by design, not a gap).
const GT_SECTIONS = {
  power: [
    { heading:"Supply requirements", variants:{}, body:{
      technical:"**Input range** 9–36 VDC, reverse-polarity protected. Idle draw `180 mA` at 24 VDC; peak draw during firmware write does not exceed `640 mA`.",
      digestible:"Runs on **9–36 volts DC** and is protected if wired backwards.",
      dotpoint:"- **9–36 VDC** input range\n- Reverse-polarity protected\n- `180 mA` idle / `640 mA` peak" } },
    { heading:"Wiring",
      variants:{ "Extended Range":{
        technical:"Use `16 AWG` minimum — Extended Range units draw more current over longer runs and are commonly cabled beyond 20 m.",
        digestible:"Extended Range units need thicker wire, since they're usually cabled much further from the power source.",
        dotpoint:"- `16 AWG` minimum\n- Rated for runs beyond 20 m" } },
      body:{
      technical:"Use `20 AWG` minimum for runs over 8 m. Terminate at the `3-pin Phoenix` connector; torque to **0.5 Nm**.",
      digestible:"Use thicker wire for long cable runs, and don't overtighten the terminal screws.",
      dotpoint:"- `20 AWG` min over 8 m\n- `3-pin Phoenix` connector\n- Torque to **0.5 Nm**" } },
  ],
  firmware: [
    { heading:"Overview", variants:{}, body:{

      digestible:"Updates come as a signed file the device checks before installing.",

    { heading:"Preparing the update", variants:{}, body:{
      technical:"Copy the `.vfw` image to the root of a `FAT32`-formatted USB drive. Do not rename the file.",
      digestible:"Put the update file on a USB stick formatted as FAT32, in the top-level folder.",

    { heading:"Applying the update",
      variants:{ "Compact":{
        technical:"The Compact enclosure has no external reset button — hold the `pinhole` reset for 4 seconds using a straightened paperclip instead.",
        digestible:"Compact units don't have a reset button on the outside — use a paperclip in the small pinhole instead.",
        dotpoint:"- Use a paperclip in the `pinhole` reset\n- Same 4-second hold" } },
      body:{
      technical:"Insert the USB while holding the recessed **reset button** for 4 seconds. The status LED flashes `amber` during write and turns `solid green` on completion.",
      digestible:"Plug in the USB and hold reset for 4 seconds. Amber means it's writing; green means it's done.",
      dotpoint:"- Hold reset **4s** while inserting USB\n- `amber` = writing\n- `solid green` = complete" } },
  ],
  mounting: [ { heading:"Overview", variants:{}, body:{
    technical:"`IP66`-rated enclosure; mount within 15° of vertical using the supplied M6 bracket. Minimum clearance **40 mm** on all sides for airflow.",
    digestible:"Mount close to vertical using the included bracket, with clearance around it for airflow.",
    dotpoint:"- `IP66`\n- Within 15° of vertical\n- **40 mm** clearance" } } ],
  calibration: [ { heading:"Overview", variants:{}, body:{
    technical:"Calibrate against a certified reference source at **20 ± 2°C**. Allow a 30-minute warm-up before taking readings.",
    digestible:"Calibrate using a certified reference at room temperature, after a 30-minute warm-up.",
    dotpoint:"- Certified reference, **20±2°C**\n- 30 min warm-up" } } ],
  interlocks: [ { heading:"Overview", variants:{}, body:{
    technical:"The enclosure lid switch cuts primary power within `200 ms` of opening; the interlock cannot be bypassed without a physical **key override**.",
    digestible:"Opening the lid cuts power almost instantly, and the safety switch can't be bypassed without a special key.",
    dotpoint:"- Lid switch cuts power under `200 ms`\n- **Key override** required to bypass" } } ],
};
function sectionsFor(topicId){ return GT_SECTIONS[topicId] || []; }

// Lightweight markdown — **bold**, `inline code`, "- " bullets — so a
// topic's copy carries real structure and can stand on its own as a doc.
function mdInline(text){
  return text
    .replace(/`([^`]+)`/g, '<span class="inline-tag">$1</span>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
}
function renderMarkdownLite(text){
  const lines = text.split("\n");
  let html = "", listBuf = [];
  const flushList = ()=>{ if(listBuf.length){ html += `<ul>${listBuf.map(li=>`<li>${mdInline(li)}</li>`).join("")}</ul>`; listBuf = []; } };
  lines.forEach(line=>{
    const t = line.trim();
    if(!t) return;
    if(t.startsWith("- ")) listBuf.push(t.slice(2));
    else { flushList(); html += `<p>${mdInline(t)}</p>`; }
  });
  flushList();
  return `<div class="md">${html}</div>`;
}

const EDITOR_DOCS = [
  { id:"d1", title:"Meridian 400 — Installation Guide", product:"meridian", kind:"Print", staleness:"stale", hasVariants:true },
  { id:"d2", title:"Meridian 400 — Field Technician Course", product:"meridian", kind:"eLearning", staleness:"fresh", hasVariants:true },
  { id:"d3", title:"Solace X2 — Sales Overview", product:"solace", kind:"Presentation", staleness:"never", hasVariants:false },
  { id:"d4", title:"Solace X2 — Facilitator Guide", product:"solace", kind:"Print", staleness:"stale", hasVariants:false },
];
const DOC_KIND_ICON = { Print:"fileText", eLearning:"monitor", Presentation:"slides" };

/* ---------------------------------------------------------------------
   State
--------------------------------------------------------------------- */
const state = {
  stage: "source",                // source | edit | publish
  product: "all",                 // all | meridian | solace
  activeTabId: "d1",
  openTabs: ["d1","d2","d3"],
  gtTopic: "firmware",
  gtVariantsSelected: new Set(),  // which variant pills are toggled on — empty = single flowing view
  gtFacet: "digestible",          // technical | digestible | dotpoint
  editorLeftView: "structure",    // structure | source
  editorSourceExpanded: null,     // topic id expanded inline in the Edit stage's Source pane
  editorShowBrowser: false,       // Edit stage showing the "no document open" document browser
  pubPicked: new Set(),           // checked in the Publish left picker
  pubQueue: ["d1","d4"],          // doc ids sent to the queue
  pubStatus: {},                  // docId -> running|done (transient, publish run)
};

function productOf(id){ return PRODUCTS.find(p=>p.id===id); }
function filteredDocs(){ return state.product==="all" ? EDITOR_DOCS : EDITOR_DOCS.filter(d=>d.product===state.product); }
function filteredTopics(){ return state.product==="all" ? GT_TOPICS : GT_TOPICS.filter(t=>t.product===state.product || t.cross); }

/* ---------------------------------------------------------------------
   Render: shell
--------------------------------------------------------------------- */
function render(){
  const app = document.getElementById("app");
  app.innerHTML = `
    ${renderTopbar()}
    <div class="body">
      ${renderRail()}
      <div class="workspace">
        <main class="stage">${renderStage()}</main>
      </div>
    </div>
  `;
  wire();
}

function renderTopbar(){
  return `
  <header class="topbar">
    <div class="brand">Verso.</div>
    <div class="product-picker">
      <select id="product-select">
        <option value="all" ${state.product==="all"?"selected":""}>All products</option>
        ${PRODUCTS.map(p=>`<option value="${p.id}" ${state.product===p.id?"selected":""}>${p.name}</option>`).join("")}
      </select>
    </div>
    ${state.stage==="edit" ? `
      <div class="topbar-divider"></div>
      <button class="tab-new" id="browse-toggle-btn" title="Browse all documents">${icon("grid")}</button>
      ${renderTopbarTabs()}
    ` : ""}
    <div class="topbar-spacer"></div>
    <div class="topbar-right">
      <span class="save-dot"></span> Saved 14:02
    </div>
  </header>`;
}

function renderTopbarTabs(){
  return `<div class="topbar-tabs">
    ${state.openTabs.map(id=>{
      const d = EDITOR_DOCS.find(x=>x.id===id);
      return `
      <div class="ttab ${(!state.editorShowBrowser && state.activeTabId===id)?"is-active":""}" data-tab="${id}">

        <button class="tab-close" data-close-tab="${id}">${icon("x")}</button>
      </div>`;
    }).join("")}
    <button class="tab-new" title="New document">${icon("plus")}</button>
  </div>`;
}

const STAGES = [
  { id:"source",  label:"Source",  icon:"layers" },
  { id:"edit",    label:"Edit",    icon:"pencil" },
  { id:"publish", label:"Publish", icon:"send" },
];

function renderRail(){
  return `
  <nav class="rail">
    ${STAGES.map(s=>`
      <button class="rail-stage ${state.stage===s.id?"is-active":""}" data-stage="${s.id}" title="${s.label}">
        ${icon(s.icon)}<span>${s.label}</span>
      </button>
    `).join("")}
    <div class="rail-spacer"></div>
    <div class="rail-actions">
      <button class="rail-action" title="Recents">${icon("history")}</button>

      <button class="rail-action" title="Settings">${icon("settings")}</button>
    </div>

}

function renderStage(){
  if(state.stage==="source") return renderGroundTruth();
  if(state.stage==="edit") return renderEditor();
  return renderPublisher();
}

/* ---------------------------------------------------------------------
   Source stage
--------------------------------------------------------------------- */
function renderGroundTruth(){
  const topics = filteredTopics();
  const topic = GT_TOPICS.find(t=>t.id===state.gtTopic) || topics[0];
  const byProduct = {};
  topics.forEach(t=>{ (byProduct[t.product] ||= []).push(t); });

  return `
  <div class="pane pane-left">
    <div class="pane-header">Source</div>
    <div class="search-input">${icon("search")}<input placeholder="Search topics, tags…" /></div>
    ${Object.entries(byProduct).map(([pid, ts])=>`
      <div class="gt-group-label">${productOf(pid).name}</div>
      ${ts.map(t=>`
        <div class="gt-topic ${state.gtTopic===t.id?"is-active":""}" data-gt-topic="${t.id}">
          ${icon(t.icon)}<span>${t.title}</span>
          ${t.cross?`<span class="gt-topic-cross">×2</span>`:""}
        </div>`).join("")}
    `).join("")}
  </div>
  <div class="pane-main">
    ${renderGroundTruthMain(topic)}
  </div>
  <div class="pane pane-right">
    ${renderGtRightPanel(topic)}
  </div>`;
}

function renderGroundTruthMain(topic){
  const variants = VARIANTS[topic.product];
  const isVisual = topic.icon==="hotspot";
  return `
  <div class="gt-main-head">
    <div class="gt-crumb">${productOf(topic.product).name}${topic.cross?" · Cross-product":""}</div>
    <div class="gt-title">${topic.title}</div>
    ${!isVisual ? `
    <div class="gt-controls-row">
      <div class="variant-toggles">
        <span class="vt-label">Variants</span>
        <span class="chip is-on" style="pointer-events:none"><span class="chip-dot"></span>Flagship</span>
        ${variants.map(v=>`
          <button class="chip ${state.gtVariantsSelected.has(v)?"is-on":""}" data-variant-toggle="${v}">
            <span class="chip-dot"></span>${v}
          </button>`).join("")}
      </div>
      <div class="facet-row"><span class="vt-label">Detail</span>${facetToggleHtml()}</div>
    </div>` : ""}
  </div>
  <div class="gt-body">${renderGtBody(topic, isVisual)}</div>`;
}

function facetToggleHtml(){
  const facets = [["technical","Technical"],["digestible","Digestible"],["dotpoint","Dot-point"]];
  return `<div class="facet-toggle">
    ${facets.map(([id,label])=>`<button data-facet="${id}" class="${state.gtFacet===id?"is-on":""}">${label}</button>`).join("")}
  </div>`;
}

function renderGtBody(topic, isVisual){
  if(isVisual){
    return `<div class="wiki-article"><div class="scope-note" style="height:220px">Live block mounts here — same 4-file block contract as the course canvas</div></div>`;
  }
  const selected = Array.from(state.gtVariantsSelected);
  const sections = sectionsFor(topic.id);
  return `<div class="wiki-article">${sections.map(s=>renderWikiSection(s, selected)).join("")}</div>`;
}

// A section only splits into variant columns where a toggled variant
// actually diverges from Flagship — everything else stays single-column.
function renderWikiSection(s, selectedVariants){
  const diverging = selectedVariants.filter(v => s.variants && s.variants[v]);
  if(diverging.length === 0){
    return `<div class="wiki-section">
      <h4>${s.heading}</h4>
      ${renderMarkdownLite(s.body[state.gtFacet])}
    </div>`;
  }
  return `<div class="wiki-section">
    <div class="wiki-section-headrow">
      <h4>${s.heading}</h4>
      <span class="variant-badge">${diverging.length} variant${diverging.length>1?"s":""} differ</span>
    </div>
    <div class="wiki-variant-split" style="grid-template-columns:repeat(${diverging.length+1},1fr)">
      <div class="wiki-variant-col">
        <div class="wiki-variant-col-label">Flagship</div>
        ${renderMarkdownLite(s.body[state.gtFacet])}
      </div>
      ${diverging.map(v=>`
        <div class="wiki-variant-col">
          <div class="wiki-variant-col-label">${v}</div>
          ${renderMarkdownLite(s.variants[v][state.gtFacet])}
        </div>`).join("")}
    </div>
  </div>`;
}

function linkedDocsFor(topic){
  return EDITOR_DOCS.filter(d=>d.product===topic.product).slice(0,2)
    .map(d=>({ doc:d.title, block:topic.title }));
}
function renderGtRightPanel(topic){
  const links = linkedDocsFor(topic);
  return `
  <div class="pane-header">Info</div>
  <div class="pane-body">
    <div class="gt-info-block">
      <div class="gt-info-label">Linked in (${links.length})</div>
      ${links.length ? links.map(l=>`
        <div class="gt-info-row">
          <div><div class="gt-info-doc">${l.doc}</div><div class="gt-info-sub">${l.block} block</div></div>
          ${icon("chevronRight","gt-info-jump")}
        </div>`).join("") : `<div class="gt-info-sub">Not currently linked in any document.</div>`}
    </div>
    <div class="gt-info-block">
      <div class="gt-info-label">History</div>
      <div class="gt-info-line">Last updated <b>25 Jul 2026</b> by <b>R. Ito</b></div>
      <div class="gt-info-line">Created <b>02 Jun 2026</b></div>
    </div>
  </div>`;
}

/* ---------------------------------------------------------------------
   Edit stage
--------------------------------------------------------------------- */
function renderEditor(){
  if(state.editorShowBrowser || !state.activeTabId || !state.openTabs.length){
    return renderEditorEmptyBrowser();
  }
  const doc = EDITOR_DOCS.find(d=>d.id===state.activeTabId) || EDITOR_DOCS[0];
  return `
  <div class="pane pane-left">
    <div class="lpane-tabs">
      <button class="${state.editorLeftView==="structure"?"is-on":""}" data-lview="structure">Structure</button>
      <button class="${state.editorLeftView==="source"?"is-on":""}" data-lview="source">Source</button>
    </div>
    ${state.editorLeftView==="structure" ? renderEditorStructurePane() : renderEditorSourcePane()}
  </div>
  <div class="pane-main">${renderEditorCanvas(doc)}</div>
  <div class="pane pane-right">
    <div class="pane-header">Inspector</div>
    <div class="pane-body"><div class="scope-note">Contextual to selection — unchanged from today's block inspectors</div></div>
  </div>`;
}

// Landing state: Edit stage with no document open — the "what does that
// menu look like" case. Listens to the same product dropdown as everything
// else; grouped by product then by document type; a marker (not a nav
// split) shows where a document carries variant-specific content.
function renderEditorEmptyBrowser(){
  return `
  <div class="pane pane-left">
    <div class="lpane-tabs">
      <button class="${state.editorLeftView==="structure"?"is-on":""}" data-lview="structure">Structure</button>
      <button class="${state.editorLeftView==="source"?"is-on":""}" data-lview="source">Source</button>
    </div>
    ${state.editorLeftView==="structure"
      ? `<div class="pane-body"><div class="scope-note">No document open — open one to see its structure</div></div>`
      : renderEditorSourcePane()}
  </div>
  <div class="pane-main">${renderDocBrowser()}</div>
  <div class="pane pane-right">
    <div class="pane-header">Inspector</div>
    <div class="pane-body"><div class="scope-note">No selection</div></div>
  </div>`;
}

function groupByKind(docs){
  const order = ["Print","eLearning","Presentation"];
  const byKind = {};
  docs.forEach(d=>{ (byKind[d.kind] ||= []).push(d); });
  return order.filter(k=>byKind[k]).map(k=>({ kind:k, docs:byKind[k] }));
}

function renderDocBrowser(){
  const docs = filteredDocs();
  const groups = state.product==="all"
    ? PRODUCTS.filter(p=>docs.some(d=>d.product===p.id)).map(p=>({
        productName:p.name, color:p.color, kinds:groupByKind(docs.filter(d=>d.product===p.id)),
      }))
    : [{ productName:null, color:null, kinds:groupByKind(docs) }];

  return `<div class="doc-browser">
    <div class="doc-browser-head">
      <div class="doc-browser-title">${state.product==="all"?"All products":productOf(state.product).name}</div>
      <button class="btn btn-primary btn-sm" style="height:26px">${icon("plus")}New document</button>
    </div>
    ${groups.map(g=>`
      ${g.productName ? `<div class="browser-product-head"><span class="product-dot" style="background:${g.color}"></span>${g.productName}</div>` : ""}
      ${g.kinds.map(kg=>`
        <div class="browser-kind-label">${kg.kind}</div>
        <div class="browser-card-row">${kg.docs.map(renderBrowserCard).join("")}</div>
      `).join("")}
    `).join("")}
  </div>`;
}

function renderBrowserCard(d){
  return `<div class="browser-card" data-open-doc="${d.id}">
    <div class="pub-icon">${icon(DOC_KIND_ICON[d.kind])}</div>
    <div class="browser-card-title">${d.title}</div>
    ${d.hasVariants ? `<span class="variant-marker"><span class="chip-dot"></span>Variants</span>` : ""}
  </div>`;
}

function renderEditorStructurePane(){
  return `<div class="pane-header">Blocks</div>
  <div class="block-outline">
    <div class="block-row is-active">${icon("fileText")}Intro</div>
    <div class="block-row">${icon("fileText")}Power requirements</div>
    <div class="block-row">${icon("image")}Enclosure diagram</div>
  </div>`;
}

// Reuses the Source stage's own nav, pinned in the Edit left panel —
// click a topic to expand an excerpt inline before inserting it.
function renderEditorSourcePane(){
  const topics = filteredTopics();
  const byProduct = {};
  topics.forEach(t=>{ (byProduct[t.product] ||= []).push(t); });
  return `<div class="pane-header">Source</div>
  <div class="search-input">${icon("search")}<input placeholder="Find a topic…" /></div>
  ${Object.entries(byProduct).map(([pid, ts])=>`
    <div class="gt-group-label">${productOf(pid).name}</div>
    ${ts.map(t=>`
      <div class="gt-topic-wrap">
        <div class="gt-topic ${state.editorSourceExpanded===t.id?"is-active":""}" data-editor-src-topic="${t.id}">
          ${icon(t.icon)}<span>${t.title}</span>
          ${t.cross?`<span class="gt-topic-cross">×2</span>`:""}
          ${icon("chevronRight","gt-expand-chevron "+(state.editorSourceExpanded===t.id?"is-open":""))}
        </div>
        ${state.editorSourceExpanded===t.id ? renderEditorSourceExcerpt(t) : ""}
      </div>`).join("")}
  `).join("")}`;
}

// Breaks the topic down into its individual copy blocks — each one its own
// insertable unit, not one combined excerpt.
function renderEditorSourceExcerpt(t){
  if(t.icon==="hotspot"){
    return `<div class="src-excerpt-list"><div class="src-block">
      <div class="scope-note" style="height:80px;font-size:10px">Live block preview</div>
      <button class="btn btn-ghost btn-sm" style="margin-top:var(--space-4)">${icon("plus")}Insert</button>
    </div></div>`;
  }
  const sections = sectionsFor(t.id);
  return `<div class="src-excerpt-list">
    ${sections.map((s,i)=>`
      <div class="src-block">
        <div class="src-block-head">
          <span class="src-block-heading">${s.heading}</span>
          <button class="btn btn-ghost btn-sm" data-insert-block="${t.id}:${i}">${icon("plus")}Insert</button>
        </div>
        ${renderMarkdownLite(s.body[state.gtFacet])}
      </div>`).join("")}
  </div>`;
}

function renderEditorCanvas(doc){
  const power = sectionsFor("power")[0];
  return `<div class="canvas-wrap"><div class="doc-page">
    <div class="doc-block"><h3>Intro</h3><p>This section introduces the ${doc.title.split(" — ")[0]} platform and its intended install environment.</p></div>
    <div class="doc-block"><h3>Power requirements<span class="gt-linked-badge">${icon("link")}Linked</span></h3>${renderMarkdownLite(power.body[state.gtFacet])}</div>
    <div class="doc-block"><h3>Enclosure diagram</h3><p style="color:var(--text-tertiary);font-style:italic">[image block]</p></div>
  </div></div>`;
}

/* ---------------------------------------------------------------------
   Publish stage — pick (left) / configure (centre) / queue (right)
--------------------------------------------------------------------- */
function renderPublisher(){
  const docs = filteredDocs();
  return `
  <div class="pane pane-left">
    <div class="pane-header">Select to publish</div>
    <div class="pub-pick-list">${docs.map(renderPubPickRow).join("")}</div>
  </div>
  <div class="pane-main">${renderPubSettings()}</div>
  ${renderPubQueuePanel()}`;
}

function renderPubPickRow(d){
  const p = productOf(d.product);
  const checked = state.pubPicked.has(d.id);
  return `<div class="pub-pick-row">
    <button class="pub-check ${checked?"is-on":""}" data-pub-pick="${d.id}">${checked?icon("check"):""}</button>
    <div class="pub-icon">${icon(DOC_KIND_ICON[d.kind])}</div>
    <div class="pub-info">
      <div class="pub-doc-title">${d.title}</div>
      <div class="pub-doc-meta" style="color:${p.color}">${p.name} · ${d.kind}</div>
    </div>
    <span class="status-dot ${d.staleness}" title="${d.staleness==='stale'?'Changed since last publish':d.staleness==='fresh'?'Up to date':'Never published'}"></span>
  </div>`;
}

function renderPubSettings(){
  if(!state.pubPicked.size){
    return `<div class="pane-header">Publish settings</div>
    <div class="pane-body"><div class="scope-note">Select one or more documents on the left to configure export settings.</div></div>`;
  }
  const picked = Array.from(state.pubPicked).map(id=>EDITOR_DOCS.find(d=>d.id===id));
  return `<div class="pane-header">Publish settings — ${picked.length} selected</div>
  <div class="pane-body">
    <div class="pub-settings-list">${picked.map(d=>`<span class="chip is-on" style="pointer-events:none">${d.title}</span>`).join("")}</div>
    <div class="settings-field">
      <label>Export format</label>
      <select><option>SCORM 1.2 package</option><option>PDF</option><option>PPTX</option></select>
    </div>
    <div class="settings-field">
      <label>Variant scope</label>
      <div class="variant-toggles"><span class="chip is-on"><span class="chip-dot"></span>All variants</span></div>
    </div>
    <div class="settings-field">
      <label>Release notes</label>
      <textarea placeholder="Optional — recorded with this release"></textarea>
    </div>
    <button class="btn btn-primary" id="add-to-queue-btn">${icon("plus")}Add ${picked.length} to queue</button>
  </div>`;
}

function renderPubQueuePanel(){
  const anyRunning = Object.values(state.pubStatus).some(s=>s==="running");
  return `<div class="pane pane-right">
    <div class="pane-header">Queue (${state.pubQueue.length})</div>
    <div class="pane-body" style="padding:0;">
      ${state.pubQueue.length
        ? state.pubQueue.map(id=>renderQueueRow(EDITOR_DOCS.find(d=>d.id===id))).join("")
        : `<div class="scope-note" style="height:120px;margin:var(--space-4);">Nothing queued yet</div>`}
    </div>
    <div class="pub-queue-footer">
      <button class="btn btn-primary" id="publish-btn" style="width:100%" ${(!state.pubQueue.length || anyRunning)?"disabled":""}>
        ${anyRunning ? `<span class="spinner"></span>Publishing…` : `${icon("send")}Publish queue`}
      </button>
    </div>
  </div>`;
}

function renderQueueRow(d){
  if(!d) return "";
  const p = productOf(d.product);
  const status = state.pubStatus[d.id];
  return `<div class="queue-row">
    <div class="pub-icon" style="width:22px;height:22px;">${icon(DOC_KIND_ICON[d.kind])}</div>
    <div class="pub-info">
      <div class="pub-doc-title" style="font-size:11px">${d.title}</div>
      <div class="pub-doc-meta" style="color:${p.color}">${p.name}</div>
    </div>
    ${status==="running" ? `<span class="spinner"></span>`
      : status==="done" ? `<span class="status-check">${icon("check")}</span>`
      : `<button class="tab-close" style="opacity:1" data-queue-remove="${d.id}" title="Remove">${icon("x")}</button>`}
  </div>`;
}

/* ---------------------------------------------------------------------
   Wiring
--------------------------------------------------------------------- */
function wire(){
  document.getElementById("product-select").onchange = e=>{ state.product = e.target.value; render(); };

  document.querySelectorAll("[data-stage]").forEach(el=>{
    el.onclick = ()=>{ state.stage = el.dataset.stage; render(); };
  });

  document.querySelectorAll("[data-tab]").forEach(el=>{
    el.onclick = (e)=>{ if(e.target.closest("[data-close-tab]")) return; state.activeTabId = el.dataset.tab; state.editorShowBrowser = false; render(); };
  });
  document.querySelectorAll("[data-close-tab]").forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation();
      const id = el.dataset.closeTab;
      state.openTabs = state.openTabs.filter(t=>t!==id);
      if(state.activeTabId===id) state.activeTabId = state.openTabs[0] || null;
      render();
    };
  });
  const browseBtn = document.getElementById("browse-toggle-btn");
  if(browseBtn) browseBtn.onclick = ()=>{ state.editorShowBrowser = true; render(); };
  document.querySelectorAll("[data-open-doc]").forEach(el=>{
    el.onclick = ()=>{
      const id = el.dataset.openDoc;
      if(!state.openTabs.includes(id)) state.openTabs.push(id);
      state.activeTabId = id;
      state.editorShowBrowser = false;
      render();
    };
  });

  document.querySelectorAll("[data-gt-topic]").forEach(el=>{
    el.onclick = ()=>{ state.gtTopic = el.dataset.gtTopic; state.gtVariantsSelected = new Set(); render(); };
  });
  document.querySelectorAll("[data-variant-toggle]").forEach(el=>{
    el.onclick = ()=>{
      const v = el.dataset.variantToggle;
      if(state.gtVariantsSelected.has(v)) state.gtVariantsSelected.delete(v); else state.gtVariantsSelected.add(v);
      render();
    };
  });
  document.querySelectorAll("[data-facet]").forEach(el=>{
    el.onclick = ()=>{ state.gtFacet = el.dataset.facet; render(); };
  });

  document.querySelectorAll("[data-lview]").forEach(el=>{
    el.onclick = ()=>{ state.editorLeftView = el.dataset.lview; render(); };
  });
  document.querySelectorAll("[data-editor-src-topic]").forEach(el=>{
    el.onclick = ()=>{
      const id = el.dataset.editorSrcTopic;
      state.editorSourceExpanded = state.editorSourceExpanded===id ? null : id;
      render();
    };
  });

  document.querySelectorAll("[data-pub-pick]").forEach(el=>{
    el.onclick = ()=>{
      const id = el.dataset.pubPick;
      if(state.pubPicked.has(id)) state.pubPicked.delete(id); else state.pubPicked.add(id);
      render();
    };
  });
  const addQueueBtn = document.getElementById("add-to-queue-btn");
  if(addQueueBtn) addQueueBtn.onclick = ()=>{
    Array.from(state.pubPicked).forEach(id=>{ if(!state.pubQueue.includes(id)) state.pubQueue.push(id); });
    state.pubPicked = new Set();
    render();
  };
  document.querySelectorAll("[data-queue-remove]").forEach(el=>{
    el.onclick = ()=>{
      const id = el.dataset.queueRemove;
      state.pubQueue = state.pubQueue.filter(x=>x!==id);
      delete state.pubStatus[id];
      render();
    };
  });
  const pubBtn = document.getElementById("publish-btn");
  if(pubBtn) pubBtn.onclick = runPublish;
}

function runPublish(){
  const ids = state.pubQueue.filter(id => state.pubStatus[id] !== "done");
  ids.forEach(id=> state.pubStatus[id] = "running");
  render();
  ids.forEach((id, i)=>{
    setTimeout(()=>{ state.pubStatus[id] = "done"; render(); }, 500 + i*450);
  });
}

/* ---------------------------------------------------------------------
   Select-to-reference affordance — open question from James's notes:
   "am I able to grab a sentence out of a whole block to reference?"
   This is deliberately NOT wired to do anything real yet — it's here so
   there's something concrete to react to, not a proposed answer.
--------------------------------------------------------------------- */
const refBtn = document.getElementById("ref-btn");
refBtn.innerHTML = `${icon("link")}<span>Reference this</span>`;
document.addEventListener("mouseup", (e)=>{
  const sel = window.getSelection();
  if(!sel || sel.isCollapsed || !e.target.closest(".gt-body")){ refBtn.style.display="none"; return; }
  const rect = sel.getRangeAt(0).getBoundingClientRect();
  if(rect.width===0){ refBtn.style.display="none"; return; }
  refBtn.style.left = (rect.left + rect.width/2) + "px";
  refBtn.style.top = (rect.top - 8) + "px";
  refBtn.style.display = "flex";
});
document.addEventListener("mousedown", (e)=>{ if(!e.target.closest("#ref-btn")) refBtn.style.display="none"; });

render();
</script>
